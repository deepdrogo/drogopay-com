<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="DrogoPay  Crypto payments that move as fast as the blockchain does.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0a0a"/><stop offset="1" stop-color="#000000"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a855"/><stop offset="1" stop-color="#7d6c38"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".42"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
    <clipPath id="icon"><rect x="64" y="52" width="196" height="196" rx="40"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect x=".5" y=".5" width="1199" height="299" rx="24" fill="none" stroke="#1f1f1f"/>

    <g opacity=".22" fill="none" stroke="#ffffff" stroke-width="1.4">
      <circle cx="980" cy="150" r="42"/>
      <circle cx="980" cy="150" r="78"/>
      <circle cx="980" cy="150" r="118"/>
      <path d="M980 32 L980 268 M862 150 L1098 150" stroke-opacity=".35"/>
    </g>
    <circle cx="980" cy="150" r="6" fill="#c9a855" opacity=".55"/>
    <circle cx="1058" cy="150" r="4" fill="#ffffff" opacity=".35"/>
    <circle cx="902" cy="150" r="4" fill="#ffffff" opacity=".28"/>
    <circle cx="980" cy="72" r="3.5" fill="#ffffff" opacity=".28"/>

    <rect x="60" y="48" width="204" height="204" rx="44" fill="#0d0d0d" stroke="#404040"/>
    <g clip-path="url(#icon)" transform="translate(64 52)">
      <rect width="196" height="196" fill="#000"/>
      <g transform="translate(22 18) scale(2.45)">
        <path fill="#FFFFFF" d="M35.4 32c.3 2.2-.3 4.5-1.7 6.3-2.8 3.6-8 4.6-12 2.3-4-2.3-5.7-7.4-3.8-11.6 1.8-4 6.5-6.2 10.8-5.1 2.3.6 4.3 2.1 5.5 4.1.4.7.7 1.4.9 2.2.1.6.2 1.2.2 1.8z"/>
        <path fill="#FFFFFF" d="M24.3 8.7l-4.5-3.2 6.6 1.7 3.6-.4 7.7.8 3.8.8-8 2.9 4.1 1.4-6.4 2.5-5.8.7z"/>
        <path fill="#000" d="M28.3 9.2l3.7.3-2.6 2z"/>
      </g>
    </g>

    <rect x="312" y="56" width="108" height="28" rx="14" fill="#0d0d0d" stroke="#404040"/>
    <text x="366" y="74.5" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#cfcfcf">PAYMENTS</text>
    <rect x="430" y="56" width="55" height="28" rx="14" fill="#c9a855" fill-opacity=".10" stroke="#c9a855"/>
    <text x="457.5" y="74.5" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#c9a855">NEW</text>
    <rect x="495" y="56" width="220" height="28" rx="14" fill="#0d0d0d" stroke="#404040"/>
    <text x="605" y="74.5" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12" font-weight="600" letter-spacing="2" fill="#cfcfcf">PART OF DROGOZ NETWORK</text>

    <text x="312" y="150" font-family="'Space Grotesk','Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="600" letter-spacing="-2" fill="url(#title)">DrogoPay</text>
    <rect x="312" y="168" width="48" height="2" fill="url(#gold)"/>
    <text x="312" y="204" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#cfcfcf">Crypto payments that move as fast as the blockchain does.</text>
    <text x="312" y="262" font-family="'JetBrains Mono','Cascadia Code',Consolas,monospace" font-size="12.5" letter-spacing="1.5" fill="#808080">DROGOPAY.COM   ·   DROGOZ.NETWORK   ·   @DROGOZ</text>
  </g>
